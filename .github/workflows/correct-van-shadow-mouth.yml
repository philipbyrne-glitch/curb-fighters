name: Correct van shadows and mouth alignment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curbs-shadow-mouth-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Correct shadows, calibrate mouths and rebuild
        run: |
          set -euo pipefail
          python3 tools/apply_shadow_mouth_swap.py
          node --check source/game.js
          python3 tools/build.py
          test -s dist/index.html
          grep -q 'CURBS_SHADOW_MOUTH_SWAP_V1' dist/index.html
      - name: Commit corrected game
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/game.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Swap Pinky's street and eating shadows; align calibrated mouths"
            git push origin HEAD:main
          fi
