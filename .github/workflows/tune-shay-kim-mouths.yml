name: Tune Shay and Kim eating mouths

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curb-fighters-mouth-tune
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Apply two character adjustments and rebuild
        run: |
          set -euo pipefail
          python3 tools/tune_shay_kim_mouths.py
          node --check source/game.js
          python3 tools/build.py
          test -s dist/index.html
          grep -q 'SHAY_KIM_MOUTH_TUNE_V1' dist/index.html
          grep -q 'PINKY_ISO_SHADOW_CALIBRATED_V1' dist/index.html
          grep -q 'CURBS_VICTORY_AUDIO_FLOW_V1' dist/index.html
          grep -q 'PINKYS_KEYBOARD_SECRET_V2' dist/index.html
      - name: Commit updated game
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/game.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Adjust Shay and Kim eating mouth positions"
            git push origin HEAD:main
          fi
