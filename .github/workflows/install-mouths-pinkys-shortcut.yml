name: Install calibrated mouths and Pinkys shortcut

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curb-fighters-mouth-shortcut
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Patch, validate and rebuild
        run: |
          set -euo pipefail
          python3 tools/apply_calibrated_mouths_and_pinkys_shortcut.py
          node --check source/game.js
          python3 tools/build.py
          test -s dist/index.html
          grep -q 'CURBS_EXACT_CALIBRATED_MOUTHS_V1' dist/index.html
          grep -q 'PINKYS_KEYBOARD_SECRET_V2' dist/index.html
          grep -q 'PINKY_ISO_SHADOW_CALIBRATED_V1' dist/index.html
          grep -q 'CURBS_VICTORY_AUDIO_FLOW_V1' dist/index.html
          grep -q '"sfx-yeah":"data:audio/mpeg;base64,' dist/index.html

      - name: Commit rebuilt game
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/game.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore calibrated mouths and add hidden Pinkys playtest shortcut"
            git push origin HEAD:main
          fi
